name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release bundle
        run: |
          msbuild .\wintun.proj -target:Driver;Zip -property:Configuration=Release -maxcpucount

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wintun-release
          if-no-files-found: error
          path: |
            Release\**\wintun.dll
            Release\**\wintun.sys
            Release\**\wintun.inf
            Release\**\wintun.cat
            dist\*.zip
