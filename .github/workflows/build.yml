name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows SDK and WDK 19041
        run: |
          choco install windows-sdk-10-version-2004-all -y --no-progress
          choco install windows-driver-kit -y --version=10.0.19041.685 --no-progress

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release bundle
        run: |
          msbuild .\wintun.proj -target:"Driver;Zip" -property:Configuration=Release -property:WindowsTargetPlatformVersion=10.0.19041.0 -maxcpucount

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wintun-release
          if-no-files-found: error
          path: |
            Release\**\wintun.dll
            Release\**\wintun.sys
            Release\**\wintun.inf
            Release\**\wintun.cat
            dist\*.zip
