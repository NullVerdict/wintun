name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Enterprise WDK 19041 ISO
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ewdkIso = Join-Path $env:RUNNER_TEMP 'ewdk.iso'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/8/1/c/81c5e1a2-045e-4263-a75d-680c8bca833b/EnterpriseWDK_rs2_release_15063.iso' -OutFile $ewdkIso
          Write-Output "EWDK ISO downloaded to $ewdkIso"

      - name: Mount EWDK and build
        run: |
          $ewdkIso = Join-Path $env:RUNNER_TEMP 'ewdk.iso'
          $mountResult = Mount-DiskImage -ImagePath $ewdkIso -PassThru
          $driveLetter = ($mountResult | Get-Volume).DriveLetter
          if (-not $driveLetter) {
            Write-Error 'Failed to mount EWDK ISO'
            exit 1
          }

          $ewdkRoot = "$driveLetter:\"
          $workspace = $env:GITHUB_WORKSPACE
          & "$ewdkRoot\LaunchBuildEnv.cmd" x64 cmd /c "cd /d `"$workspace`" && msbuild wintun.proj -target:Driver;Zip -property:Configuration=Release -property:WindowsTargetPlatformVersion=10.0.19041.0 -maxcpucount"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "EWDK build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Dismount-DiskImage -ImagePath $ewdkIso

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wintun-release
          if-no-files-found: error
          path: |
            Release\**\wintun.dll
            Release\**\wintun.sys
            Release\**\wintun.inf
            Release\**\wintun.cat
            dist\*.zip
