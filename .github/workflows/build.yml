name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows SDK and WDK 19041
        run: |
          choco install windows-sdk-10-version-2004-all -y --no-progress
          $ProgressPreference = 'SilentlyContinue'
          $wdkInstaller = Join-Path $env:TEMP 'wdksetup.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/c/f/8/cf80b955-d578-4635-825c-2801911f9d79/wdk/wdksetup.exe' -OutFile $wdkInstaller
          Start-Process -FilePath $wdkInstaller -ArgumentList '/quiet','/norestart' -Wait
          if (-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.19041.0\km\ntifs.h')) {
            Write-Error 'WDK installation failed: ntifs.h not found'
            exit 1
          }
          Remove-Item $wdkInstaller -ErrorAction SilentlyContinue

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release bundle
        run: |
          msbuild .\wintun.proj -target:"Driver;Zip" -property:Configuration=Release -property:WindowsTargetPlatformVersion=10.0.19041.0 -maxcpucount

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wintun-release
          if-no-files-found: error
          path: |
            Release\**\wintun.dll
            Release\**\wintun.sys
            Release\**\wintun.inf
            Release\**\wintun.cat
            dist\*.zip
